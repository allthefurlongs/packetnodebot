[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packetnodebot"
version = "0.1.0"
description = "Interact with a ham radio packet node via an online chat service"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Ham Radio",
    "Framework :: AsyncIO"
]
dependencies = [
  "pyyaml",
  "discord.py==2.3.2"
]

[project.urls]
Homepage = "https://github.com/allthefurlongs/packetnodebot"
Issues = "https://github.com/allthefurlongs/packetnodebot/issues"

[project.scripts]
bpqnodebot = "packetnodebot.bpq:bpqnodebot"
